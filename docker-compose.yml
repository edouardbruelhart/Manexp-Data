services:

  database:

    image: postgres:18

    restart: unless-stopped

    volumes:
      - postgres_data:/var/lib/postgresql

    environment:
      POSTGRES_USER: "${POSTGRES_ADMIN_USER}"
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_PASSWORD: "${POSTGRES_ADMIN_PASSWORD}"

    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""
        ]
      interval: 10s
      timeout: 5s
      retries: 50
      start_period: 10s

    networks:
      - backend

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  pipeline:

    image: manexp-data:test

    restart: no

    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_PIPELINE_USER: "${POSTGRES_PIPELINE_USER}"
      POSTGRES_PIPELINE_PASSWORD: "${POSTGRES_PIPELINE_PASSWORD}"
      EMAIL_SENDER: "${EMAIL_SENDER}"
      EMAIL_SENDER_PASSWORD: "${EMAIL_SENDER_PASSWORD}"
      SMTP: "${SMTP}"
      EMAIL_RECEIVER: "${EMAIL_RECEIVER}"

    depends_on:
      database:
        condition: service_healthy

    networks:
      - backend
      - outbound

volumes:

  postgres_data:

networks:

  backend:
    driver: bridge

  outbound:
    driver: bridge
