site_name: Manexp Data Documentation
site_author: Edouard Brülhart

repo_name: edouardbruelhart/Manexp-Data
copyright: Maintained by <a
  href="https://github.com/edouardbruelhart">edouardbruelhart</a>.

plugins:
- search
- mkdocstrings:
    handlers:
      python:
        paths: ["manexp_data"]
        import:
        - https://raw.githubusercontent.com/pyapp-kit/griffe-fieldz/main/README.md
        options:
          show_signature: true
          show_source: false
          docstring_style: google
          docstring_section_style: table
          members_order: source
          separate_signature: true
          show_signature_annotations: true
          show_docstring_parameters: true
          show_docstring_returns: true
          show_docstring_description: true
          show_model_fields: false
          merge_init_into_class: true
          show_if_no_docstring: false
          show_members: true
          filters: ["!^_"]
          show_root_heading: false
          line_length: 60
          show_docstring_attributes: true
          show_docstring_examples: true
          extensions:
          - griffe_fieldz

theme:
  name: material
  palette:
  - media: "(prefers-color-scheme: light)"
    scheme: default
    primary: white
    accent: deep orange
    toggle:
      icon: material/brightness-7
      name: Switch to dark mode
  - media: "(prefers-color-scheme: dark)"
    scheme: slate
    primary: black
    accent: deep orange
    toggle:
      icon: material/brightness-4
      name: Switch to light mode
  features:
  - content.tabs.link
  - content.code.annotate
  - content.code.copy
  - announce.dismiss
  - navigation.tabs
  - navigation.instant
  - navigation.instant.prefetch
  - navigation.instant.preview
  - navigation.instant.progress
  - navigation.path
  - navigation.sections
  - navigation.top
  - navigation.tracking
  - search.suggest
  - toc.follow
  icon:
    repo: fontawesome/brands/github

nav:
- Run: manexp_data/run.md
- Clients:
  - Gbif client: manexp_data/clients/gbif_client.md
  - Translation client: manexp_data/clients/translation_client.md
- Core:
  - Logging config: manexp_data/core/logging_config.md
  - Mailer: manexp_data/core/mailer.md
  - Parsers: manexp_data/core/parsers.md
  - Strict model: manexp_data/core/strict_model.md
- Exceptions:
  - Code mismatch: manexp_data/exceptions/code_mismatch.md
  - Invalid chemical: manexp_data/exceptions/invalid_chemical.md
  - Invalid pseudo boolean: manexp_data/exceptions/invalid_pseudo_boolean.md
  - Invalid xml: manexp_data/exceptions/invalid_xml.md
  - Language installation failed:
      manexp_data/exceptions/language_installation_failed.md
  - No pk detected: manexp_data/exceptions/no_pk_detected.md
  - Postgresql configuration failed:
