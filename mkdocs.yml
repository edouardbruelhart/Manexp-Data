  - Extract:
    - Download phytosanitary products:
        manexp_data/phytosanitary_products/extract/download_phytosanitary_products.md
    - Extract indications:
        manexp_data/phytosanitary_products/extract/extract_indications.md
  - Load:
    - Load phytosanitary products:
        manexp_data/phytosanitary_products/load/load_phytosanitary_products.md
  - Transform:
    - Clean indications:
        manexp_data/phytosanitary_products/transform/clean_indications.md
    - Clean metadata:
        manexp_data/phytosanitary_products/transform/clean_metadata.md
    - Clean products:
        manexp_data/phytosanitary_products/transform/clean_products.md
    - Merge phyto: manexp_data/phytosanitary_products/transform/merge_phyto.md
    - Parsers: manexp_data/phytosanitary_products/transform/parsers.md
- Postgres helpers:
  - Apply schema: manexp_data/postgres_helpers/apply_schema.md
  - Database connection: manexp_data/postgres_helpers/database_connection.md
  - Generate create tables:
      manexp_data/postgres_helpers/generate_create_tables.md
  - Generate foreign key constraints:
      manexp_data/postgres_helpers/generate_foreign_key_constraints.md
  - Generate schema: manexp_data/postgres_helpers/generate_schema.md
  - Synchronize: manexp_data/postgres_helpers/synchronize.md
- Seeds:
  - Get seeds: manexp_data/seeds/get_seeds.md
  - Extract:
    - Create countries: manexp_data/seeds/extract/create_countries.md
    - Create register subtypes:
        manexp_data/seeds/extract/create_register_subtypes.md
    - Create register types: manexp_data/seeds/extract/create_register_types.md
    - Download plant varieties:
