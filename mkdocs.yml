    - Download taxonomy: manexp_data/seeds/extract/download_taxonomy.md
  - Load:
    - Load seeds: manexp_data/seeds/load/load_seeds.md
  - Transform:
    - Booleanize plant varieties:
        manexp_data/seeds/transform/booleanize_plant_varieties.md
    - Clean plant varieties denominations:
        manexp_data/seeds/transform/clean_plant_varieties_denominations.md
    - Clean taxonomy: manexp_data/seeds/transform/clean_taxonomy.md
    - Color taxonomy: manexp_data/seeds/transform/color_taxonomy.md
    - Filter plant varieties:
        manexp_data/seeds/transform/filter_plant_varieties.md
    - Filter taxonomy: manexp_data/seeds/transform/filter_taxonomy.md
    - Iconize taxonomy: manexp_data/seeds/transform/iconize_taxonomy.md
    - Merge taxonomy: manexp_data/seeds/transform/merge_taxonomy.md
    - Replace plant varieties relations:
