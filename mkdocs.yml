  - Separator error: manexp_data/exceptions/separator_error.md
  - Unexpected xml child: manexp_data/exceptions/unexpected_xml_child.md
  - Unexpected xml element: manexp_data/exceptions/unexpected_xml_element.md
  - Unexpected xml language: manexp_data/exceptions/unexpected_xml_language.md
  - Unresolved foreign key: manexp_data/exceptions/unresolved_foreign_key.md
  - Unsupported os: manexp_data/exceptions/unsupported_os.md
  - Unsupported type: manexp_data/exceptions/unsupported_type.md
- Phytosanitary products:
  - Get phytosanitary products:
