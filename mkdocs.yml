    - Translate countries: manexp_data/seeds/transform/translate_countries.md
extra:
  social:
  - icon: fontawesome/brands/github
    link: https://github.com/edouardbruelhart/Manexp-Data
  - icon: fontawesome/solid/globe
    link: https://manexp.ch

markdown_extensions:
- tables
- admonition
- pymdownx.details
- pymdownx.superfences
- pymdownx.highlight:
    pygments_lang_class: true
- pymdownx.tabbed:
    alternate_style: true
- pymdownx.snippets
